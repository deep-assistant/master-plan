<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Assistant - Public Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .status-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .last-update {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .service {
            border-bottom: 1px solid #e5e5e5;
            padding: 20px 0;
        }

        .service:last-child {
            border-bottom: none;
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .service-name {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-operational {
            background: #10b981;
            color: white;
        }

        .status-down {
            background: #ef4444;
            color: white;
        }

        .status-degraded {
            background: #f59e0b;
            color: white;
        }

        .service-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .metric {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
        }

        .metric-unit {
            font-size: 0.9rem;
            color: #6b7280;
            font-weight: normal;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.8;
        }

        .footer a {
            color: white;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .service-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .service-metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Deep Assistant</h1>
            <p>Public Status Dashboard</p>
        </div>

        <div class="status-card">
            <div id="last-update" class="last-update">Loading...</div>
            <div id="services-container"></div>
        </div>

        <div class="footer">
            <p>Monitoring updates every minute | <a href="https://github.com/deep-assistant" target="_blank">GitHub Organization</a></p>
        </div>
    </div>

    <script>
        async function loadStatus() {
            try {
                const response = await fetch('./monitoring-data/status.json');
                const data = await response.json();
                displayStatus(data);
            } catch (error) {
                console.error('Error loading status:', error);
                document.getElementById('services-container').innerHTML = `
                    <div class="error-message">
                        Unable to load monitoring data. Please check back later.
                    </div>
                `;
            }
        }

        function displayStatus(data) {
            const lastUpdate = new Date(data.lastUpdate);
            document.getElementById('last-update').textContent =
                `Last updated: ${lastUpdate.toLocaleString()}`;

            const servicesHtml = data.services.map(service => {
                const statusClass = `status-${service.status}`;
                const statusText = service.status === 'operational' ? 'Operational' : 'Down';

                let metricsHtml = '';
                if (service.status === 'operational') {
                    metricsHtml = `
                        <div class="service-metrics">
                            <div class="metric">
                                <div class="metric-label">Current Latency</div>
                                <div class="metric-value">
                                    ${service.latency !== null ? service.latency : 'N/A'}
                                    ${service.latency !== null ? '<span class="metric-unit">ms</span>' : ''}
                                </div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Average Latency</div>
                                <div class="metric-value">
                                    ${service.avgLatency !== null ? service.avgLatency : 'N/A'}
                                    ${service.avgLatency !== null ? '<span class="metric-unit">ms</span>' : ''}
                                </div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Min Latency</div>
                                <div class="metric-value">
                                    ${service.minLatency !== null ? service.minLatency : 'N/A'}
                                    ${service.minLatency !== null ? '<span class="metric-unit">ms</span>' : ''}
                                </div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Uptime (10 checks)</div>
                                <div class="metric-value">
                                    ${service.successRate}
                                    <span class="metric-unit">%</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                let errorHtml = '';
                if (service.error) {
                    errorHtml = `
                        <div class="error-message">
                            <strong>Error:</strong> ${service.error}
                        </div>
                    `;
                }

                return `
                    <div class="service">
                        <div class="service-header">
                            <div class="service-name">
                                ${service.status === 'operational' ? '✅' : '❌'}
                                ${service.name}
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        ${metricsHtml}
                        ${errorHtml}
                    </div>
                `;
            }).join('');

            document.getElementById('services-container').innerHTML = servicesHtml;
        }

        // Load status on page load
        loadStatus();

        // Refresh every 30 seconds
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
